name: Update leaderboards

on:
  schedule:
    - cron: '7 * * * *'   # hourly, a few minutes past the hour
  workflow_dispatch: {}   # lets you trigger a refresh by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install requests

      - run: python scripts/fetch_leaderboards.py

      - name: Commit updated data
        run: |
          git config user.name "leaderboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/leaderboards.json
          git diff --cached --quiet || git commit -m "Update leaderboards"
          git push
